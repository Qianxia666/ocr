<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 · 识别台</title>
    <link rel="icon" href="{{ favicon_url }}" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown.min.css">
    {% if turnstile_enabled %}
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    {% endif %}
    <link rel="stylesheet" href="/static/console.css">
</head>
<body>

<div class="gate">

    <aside class="gate-side">
        <div class="gate-mark">
            <span class="mark-box">OCR</span>
            <span class="mark-name">识别台</span>
        </div>

        <div class="gate-side-mid">
            <p class="gate-no">00 / 邀请注册</p>
            <h1 class="gate-title">凭链接<br>开一张账户。</h1>
            <p class="gate-lede">注册入口由管理员发放的邀请链接开启，链接自带配额与有效期。账户建立后即可上传识别。</p>

            <dl class="gate-spec">
                <div><dt>用户名字符</dt><dd>3 – 20 位</dd></div>
                <div><dt>密码长度</dt><dd>≥ 6 位</dd></div>
                <div><dt>注册凭证</dt><dd>邀请链接</dd></div>
                <div><dt>初始额度</dt><dd>随链接分配</dd></div>
            </dl>
        </div>

        <div class="gate-side-foot">
            <span>v1.0</span>
            <span>·</span>
            <a href="https://github.com/Qianxia666/ocr" target="_blank">GitHub</a>
        </div>
    </aside>

    <main class="gate-main">
        <div class="gate-wrap">

            <div class="gate-head">
                <span class="gate-head-no">01 / 建立账户</span>
                <h2>用户注册</h2>
            </div>

            <form id="register-form" class="gate-form">
                <div class="fld">
                    <label for="username"><span class="fld-no">01</span>用户名</label>
                    <input type="text" id="username" required placeholder="3–20 个字符" autocomplete="username">
                </div>
                <div class="fld">
                    <label for="password"><span class="fld-no">02</span>密码</label>
                    <input type="password" id="password" required placeholder="至少 6 个字符" autocomplete="new-password">
                </div>
                <div class="fld">
                    <label for="password-confirm"><span class="fld-no">03</span>确认密码</label>
                    <input type="password" id="password-confirm" required placeholder="再次输入密码" autocomplete="new-password">
                </div>

                {% if turnstile_enabled %}
                <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-callback="onTurnstileSuccess"></div>
                {% endif %}
                <input type="hidden" id="token" required>
                <input type="hidden" id="turnstile-token" required>

                <div class="gate-check">
                    <input type="checkbox" id="register-agree" required>
                    <label for="register-agree">我已阅读并同意 <a href="#" onclick="showAgreement(event)">《用户协议》</a></label>
                </div>

                <button type="submit" id="submit-btn" class="gate-submit">注册 →</button>
            </form>

            <div id="message" class="gate-msg hidden"></div>

            <div class="gate-alt">
                <span>识别台 / 邀请制</span>
                <a href="/login">已有账号？返回登录</a>
            </div>

        </div>
    </main>

</div>

<div id="agreement-modal" class="gate-modal hidden">
    <div class="gate-modal-box">
        <div class="gate-modal-head">
            <h3>用户协议 / TERMS</h3>
            <button type="button" onclick="closeAgreement()" aria-label="关闭">✕</button>
        </div>
        <div class="gate-modal-body">
            <div id="agreement-content" class="markdown-body"></div>
        </div>
        <div class="gate-modal-foot">
            <button type="button" class="primary" onclick="acceptAndClose()">同意并继续</button>
            <button type="button" onclick="closeAgreement()">关闭</button>
        </div>
    </div>
</div>

<script>
    const baseUrl = window.location.origin;
    const turnstileEnabled = {% if turnstile_enabled %}true{% else %}false{% endif %};
    const registerForm = document.getElementById('register-form');
    const messageDiv = document.getElementById('message');
    const tokenInput = document.getElementById('token');
    const turnstileTokenInput = document.getElementById('turnstile-token');
    const submitBtn = document.getElementById('submit-btn');

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '{{ token }}';

    // ==================== 用户协议 ====================
    async function showAgreement(event) {
        event.preventDefault();
        try {
            const response = await fetch(`${baseUrl}/api/user-agreement/current`);
            const data = await response.json();

            if (data.status === 'success' && data.agreement) {
                const content = data.agreement.content;
                const modal = document.getElementById('agreement-modal');
                const contentDiv = document.getElementById('agreement-content');

                if (typeof marked !== 'undefined') {
                    if (typeof marked.parse === 'function') {
                        contentDiv.innerHTML = marked.parse(content);
                    } else if (typeof marked === 'function') {
                        contentDiv.innerHTML = marked(content);
                    } else {
                        contentDiv.innerHTML = content.replace(/\n/g, '<br>');
                    }
                } else {
                    contentDiv.innerHTML = content.replace(/\n/g, '<br>');
                }

                modal.classList.remove('hidden');
            } else {
                showMessage('暂无用户协议', 'error');
            }
        } catch (error) {
            console.error('加载用户协议失败:', error);
            showMessage('加载用户协议失败,请稍后重试', 'error');
        }
    }

    function closeAgreement() {
        document.getElementById('agreement-modal').classList.add('hidden');
    }

    function acceptAndClose() {
        document.getElementById('register-agree').checked = true;
        closeAgreement();
    }

    function onTurnstileSuccess(t) {
        turnstileTokenInput.value = t;
    }

    async function checkToken() {
        if (!token) {
            showMessage('错误：缺少注册令牌。请通过管理员提供的链接访问此页面。', 'error');
            submitBtn.disabled = true;
            return;
        }

        try {
            const response = await fetch(`${baseUrl}/api/registration/validate-token?token=${encodeURIComponent(token)}`);
            const data = await response.json();

            if (response.ok && data.status === 'success') {
                tokenInput.value = token;
            } else {
                showMessage(data.message || '该注册链接已达到最大注册人数或已失效', 'error');
                submitBtn.disabled = true;
                document.getElementById('username').disabled = true;
                document.getElementById('password').disabled = true;
                document.getElementById('password-confirm').disabled = true;
            }
        } catch (error) {
            console.error('验证令牌失败:', error);
            showMessage('网络错误，无法验证注册令牌', 'error');
            submitBtn.disabled = true;
        }
    }

    checkToken();

    function showMessage(msg, type = 'info') {
        messageDiv.textContent = msg;
        messageDiv.className = 'gate-msg ' + (type === 'success' ? 'ok' : type === 'error' ? 'err' : '');
        messageDiv.classList.remove('hidden');
    }

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('password-confirm').value;
        const tk = tokenInput.value.trim();
        const turnstileToken = turnstileTokenInput.value.trim();
        const agreed = document.getElementById('register-agree').checked;

        if (!tk) {
            showMessage('错误：缺少注册令牌', 'error');
            return;
        }
        if (!agreed) {
            showMessage('请先阅读并同意用户协议', 'error');
            return;
        }
        if (turnstileEnabled && !turnstileToken) {
            showMessage('请完成人机验证', 'error');
            return;
        }
        if (password !== passwordConfirm) {
            showMessage('两次输入的密码不一致', 'error');
            return;
        }

        try {
            submitBtn.disabled = true;
            submitBtn.textContent = '注册中…';

            const response = await fetch(`${baseUrl}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username,
                    password,
                    token: tk,
                    turnstile_token: turnstileToken
                })
            });

            const data = await response.json();

            if (response.ok && data.status === 'success') {
                showMessage('注册成功！正在跳转到登录页面…', 'success');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                showMessage(data.detail || data.message || '注册失败', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '注册 →';
            }
        } catch (error) {
            console.error('Register error:', error);
            showMessage('网络错误，请重试', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = '注册 →';
        }
    });
</script>
</body>
</html>
