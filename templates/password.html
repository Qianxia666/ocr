<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访问校验 · 识别台</title>
  <link rel="icon" href="{{ favicon_url }}" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/console.css">
</head>
<body>

<div class="gate">

  <aside class="gate-side">
    <div class="gate-mark">
      <span class="mark-box">OCR</span>
      <span class="mark-name">识别台</span>
    </div>

    <div class="gate-side-mid">
      <p class="gate-no">00 / 访问闸门</p>
      <h1 class="gate-title">这道门<br>只认密码。</h1>
      <p class="gate-lede">实例开启了访问密码，输入口令后即可进入识别台。口令保存在本机，勾选记住可省去下次输入。</p>

      <dl class="gate-spec">
        <div><dt>校验方式</dt><dd>实例口令</dd></div>
        <div><dt>存储位置</dt><dd>仅本浏览器</dd></div>
        <div><dt>会话时长</dt><dd>随浏览器</dd></div>
        <div><dt>失败处理</dt><dd>清空口令重试</dd></div>
      </dl>
    </div>

    <div class="gate-side-foot">
      <span>v1.0</span>
      <span>·</span>
      <a href="https://github.com/Qianxia666/ocr" target="_blank">GitHub</a>
    </div>
  </aside>

  <main class="gate-main">
    <div class="gate-wrap">

      <div class="gate-head">
        <span class="gate-head-no">01 / 口令核验</span>
        <h2>访问密码</h2>
      </div>

      <form id="password-form" class="gate-form">
        <div class="fld">
          <label for="password"><span class="fld-no">01</span>口令</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="请输入访问密码"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="gate-check">
          <input type="checkbox" id="remember-password" name="remember">
          <label for="remember-password">记住密码，下次自动通过</label>
        </div>

        <div id="error-message" class="gate-msg err hidden">
          <span id="error-text">密码错误，请重试</span>
        </div>

        <button type="submit" id="submit-btn" class="gate-submit">
          <span id="btn-text">立即访问 →</span>
          <span id="btn-loading" class="hidden">校验中…</span>
        </button>
      </form>

      <div class="gate-alt">
        <span>识别台 / 实例保护</span>
        <a href="https://github.com/Qianxia666/ocr" target="_blank">项目地址</a>
      </div>

    </div>
  </main>

</div>

<script>
  // 已保存口令则自动校验
  const savedPassword = localStorage.getItem('ocr_password');
  if (savedPassword) {
    verifyPassword(savedPassword, true);
  }

  const passwordForm = document.getElementById('password-form');
  const passwordInput = document.getElementById('password');
  const rememberCheckbox = document.getElementById('remember-password');
  const errorMessage = document.getElementById('error-message');
  const errorText = document.getElementById('error-text');
  const submitBtn = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');
  const btnLoading = document.getElementById('btn-loading');

  passwordForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = passwordInput.value.trim();
    const remember = rememberCheckbox.checked;

    if (!password) {
      showError('请输入密码');
      return;
    }

    await verifyPassword(password, remember);
  });

  async function verifyPassword(password, remember = false) {
    submitBtn.disabled = true;
    btnText.classList.add('hidden');
    btnLoading.classList.remove('hidden');

    try {
      const response = await fetch(`/${password}`, {
        method: 'GET',
        headers: { 'Accept': 'text/html' }
      });

      if (response.ok) {
        if (remember) {
          localStorage.setItem('ocr_password', password);
        } else {
          localStorage.removeItem('ocr_password');
        }
        window.location.href = `/${password}`;
      } else {
        localStorage.removeItem('ocr_password');
        showError('密码错误，请重试');
        passwordInput.value = '';
        passwordInput.focus();

        submitBtn.disabled = false;
        btnText.classList.remove('hidden');
        btnLoading.classList.add('hidden');
      }
    } catch (error) {
      console.error('验证失败:', error);
      showError('验证失败，请重试');

      submitBtn.disabled = false;
      btnText.classList.remove('hidden');
      btnLoading.classList.add('hidden');
    }
  }

  function showError(message) {
    errorText.textContent = message;
    errorMessage.classList.remove('hidden');

    setTimeout(() => {
      errorMessage.classList.add('hidden');
    }, 4000);
  }

  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('error') === 'invalid') {
    showError('密码错误或已过期，请重新输入');
    localStorage.removeItem('ocr_password');
  }
</script>
</body>
</html>
