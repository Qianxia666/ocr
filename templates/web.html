<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="icon" href="{{ favicon_url }}" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 KaTeX 样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css">
  <!-- 引入 GitHub Markdown 样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown.min.css">
  <link rel="stylesheet" href="/static/console.css">
</head>
<body class="h-screen flex flex-col overflow-hidden">

          </svg>
          项目地址

        <a href="#" class="menu-item" id="about-menu">

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          关于

      </div>
    </div>
  </header>

  <!-- 公告模态框 -->
  <div id="announcement-modal" class="ws-modal hidden">
    <div class="ws-modal-box">
      <div id="announcement-modal-header" class="ws-modal-head">
        <svg id="announcement-modal-icon" class="ws-modal-icon" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
        </svg>
        <h2>系统公告</h2>
      </div>

      <div class="ws-modal-body">
        <div id="announcement-modal-content" class="markdown-body"></div>
      </div>

      <div class="ws-modal-foot">
        <button id="announcement-agree-btn" onclick="agreeAnnouncement()" class="btn-solid">我已知晓</button>
      </div>
    </div>
  </div>

  <!-- 主体：左投递 + 右记录带 -->
  <div class="ws-body">

    <aside class="intake">
      <div class="intake-head">
        <span class="intake-no">01 / 投递</span>
        <h2>上传文件</h2>
      </div>

      <div id="upload-box" class="intake-drop">
        <div id="upload-prompt">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
          </svg>
          <div class="drop-main">点击或拖拽文件到此</div>
          <div class="drop-sub">图片 / PDF 均可</div>
        </div>
      </div>

      <dl class="intake-spec">
        <div><dt>图片上限</dt><dd id="spec-img">50 MB</dd></div>
        <div><dt>PDF 上限</dt><dd id="spec-pdf">50 MB</dd></div>
        <div><dt>识别语言</dt><dd>图文混排 / 表格</dd></div>
        <div><dt>输出</dt><dd>Markdown</dd></div>
      </dl>

      <p class="intake-note">上传后自动排队识别，结果会按时间排进下方的记录带，可直接复制或导出。</p>
    </aside>

    <section class="strip">
      <div class="strip-head">
        <span>02 / 识别记录</span>
        <span class="strip-hint">横向滚动查看 · 新的在最左</span>
      </div>

      <div class="strip-body">
        <div class="card-container">
          <div class="strip-empty">
            <span class="strip-empty-no">空</span>
            <p>还没有识别记录。左侧上传一张图片或一份 PDF，识别结果会依次排列在这里。</p>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script>
    // 全局配置
    let frontendConfig = {
      frontend_poll_timeout: 300,  // 默认300秒
      max_image_size_mb: 50,
      max_pdf_size_mb: 50,
      max_pdf_pages: 50
    };

    // 加载前端配置
    async function loadFrontendConfig() {
      try {
        const backurl = "{{ backurl }}";
        const baseUrl = backurl || (window.location.origin + window.location.pathname.replace(/\/$/, ''));
        const response = await fetch(`${baseUrl}/api/frontend/config`);
        const data = await response.json();

        if (data.status === "success" && data.config) {
          frontendConfig = data.config;
          console.log("前端配置已加载:", frontendConfig);
        }
      } catch (err) {
        console.warn("加载前端配置失败,使用默认值:", err);
      }
    }

    // 页面加载时获取配置
    loadFrontendConfig();

    const uploadBox = document.getElementById("upload-box");
    const uploadPrompt = document.getElementById("upload-prompt");
    const cardContainer = document.querySelector(".card-container");

    let currentTaskId = null;

    // PC端鼠标滚轮横向滚动支持
    cardContainer.addEventListener('wheel', (e) => {
      // 检查是否在卡片内容区域内
      const target = e.target;
      const isInContent = target.closest('.content');

      // 如果在内容区域内,不处理(让内容区域自己滚动)
      if (isInContent) {
        return;
      }

      // 如果是垂直滚动,转换为横向滚动
      if (e.deltaY !== 0) {
        e.preventDefault();
        cardContainer.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    // 格式化时间为 YYYY-MM-DD HH:mm
    function formatTaskTime(dateString) {
      const date = new Date(dateString);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hour = String(date.getHours()).padStart(2, '0');
      const minute = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hour}:${minute}`;
    }

    // Markdown渲染函数
    function renderMarkdown(content) {
      if (!content) return '<div class="text-center text-gray-500">暂无内容</div>';

      const html = marked.parse(content);
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;

      // 使用KaTeX渲染公式
      renderMathInElement(tempDiv, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ]
      });

      return tempDiv.innerHTML;
    }

    // 上传文件事件
    uploadBox.addEventListener("dragover", (e) => {
      e.preventDefault();
      uploadBox.classList.add("border-blue-600");
      uploadBox.classList.remove("border-blue-300");
    });

    uploadBox.addEventListener("dragleave", () => {
      uploadBox.classList.remove("border-blue-600");
      uploadBox.classList.add("border-blue-300");
    });

    uploadBox.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadBox.classList.remove("border-blue-600");
      uploadBox.classList.add("border-blue-300");
      const file = e.dataTransfer.files[0];
      handleFile(file);
    });

    uploadBox.addEventListener("click", () => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*,.pdf";
      input.onchange = (e) => {
        const file = e.target.files[0];
        handleFile(file);
      };
      input.click();
    });

    function handleFile(file) {
      const isPdf = file.type.includes("pdf") || file.name.toLowerCase().endsWith('.pdf');
      const maxSizeMB = isPdf
        ? (frontendConfig.max_pdf_size_mb || 50)
        : (frontendConfig.max_image_size_mb || 50);
      const fileSizeMB = file.size / (1024 * 1024);
      if (fileSizeMB > maxSizeMB) {
        alert(`文件大小 (${fileSizeMB.toFixed(2)} MB) 超过限制 (${maxSizeMB} MB)`);
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      const backurl = "{{ backurl }}";
      const baseUrl = backurl || (window.location.origin + window.location.pathname.replace(/\/$/, ''));
      const url = isPdf ? `${baseUrl}/process/pdf` : `${baseUrl}/process/image`;

      console.log("上传URL:", url);

      fetch(url, { method: "POST", body: formData })
        .then(async (response) => {
          if (!response.ok) {
            // 尝试从响应中获取详细错误信息
            let errorMessage = `HTTP ${response.status}: 处理请求失败`;
            try {
              const errorData = await response.json();
              if (errorData.detail) {
                errorMessage = errorData.detail;
              }
            } catch (e) {
              // 无法解析JSON,使用默认错误消息
            }
            throw new Error(errorMessage);
          }
          return response.json();
        })
        .then((data) => {
          handleProcessResult(data, isPdf);
        })
        .catch((err) => {
          console.error("处理失败:", err);
          alert(`文件处理失败: ${err.message}`);
        });
    }

    function handleProcessResult(data, isPdf) {
      // 处理新的异步任务响应格式
      if (data.status === "accepted" && data.task_id) {
        currentTaskId = data.task_id;

        // 立即刷新一次,然后延迟再刷新一次确保新任务卡片显示
        loadTasks();
        setTimeout(() => {
          loadTasks();
        }, 300);

        // 轮询任务结果
        pollTaskResult(data.task_id);
        return;
      }

      // 处理旧的同步响应格式
      if (data.status === "success" || data.status === "partial_success") {
        loadTasks(); // 刷新任务列表
      } else {
        alert(data.message || "处理失败，请重试");
      }
    }

    // 轮询任务结果
    async function pollTaskResult(taskId, maxAttempts = null) {
      // 如果没有指定maxAttempts,使用配置的超时时间计算
      if (maxAttempts === null) {
        const pollInterval = 2;  // 2秒轮询一次
        maxAttempts = Math.ceil(frontendConfig.frontend_poll_timeout / pollInterval);
      }

      let attempts = 0;
      const pollInterval = 2000; // 2秒

      const poll = async () => {
        if (attempts >= maxAttempts) {
          alert(`任务处理超时(${frontendConfig.frontend_poll_timeout}秒),请刷新页面查看结果`);
          loadTasks(); // 最后刷新一次任务列表
          return;
        }

        attempts++;

        try {
          // 每次轮询都刷新任务列表，以显示最新状态
          loadTasks();

          // 检查任务状态
          const backurl = "{{ backurl }}";
          const baseUrl = backurl || (window.location.origin + window.location.pathname.replace(/\/$/, ''));
          const response = await fetch(`${baseUrl}/api/tasks/${taskId}`, {
            credentials: 'include'
          });
          const data = await response.json();

          if (data.status === "success" && data.data) {
            const taskStatus = data.data.status;

            if (taskStatus === 'completed' || taskStatus === 'failed') {
              // 任务完成，停止轮询
              loadTasks(); // 最后刷新一次任务列表
              return;
            }
          }

          // 继续轮询
          setTimeout(poll, pollInterval);
        } catch (err) {
          console.error("轮询任务结果失败:", err);
          setTimeout(poll, pollInterval);
        }
      };

      // 立即刷新任务列表显示新任务
      loadTasks();
      poll();
    }

    // 创建结果卡片元素
    function createResultCard(task) {
      const statusConfig = {
        'pending': { class: 'status-pending', text: '等待中' },
        'processing': { class: 'status-processing', text: '处理中' },
        'completed': { class: 'status-completed', text: '已完成' },
        'failed': { class: 'status-failed', text: '失败' },
        'cancelled': { class: 'status-cancelled', text: '已取消' }
      };

      const status = statusConfig[task.status] || statusConfig['pending'];

      const card = document.createElement('div');
      card.className = 'card doc-card';
      card.dataset.taskId = task.id;
      card.dataset.taskStatus = task.status;

      card.innerHTML = `
        <div class="doc-head">
          <h3 class="title" title="${task.file_name || '未命名文件'}">${task.file_name || '未命名文件'}</h3>
          <span class="status-badge ${status.class}">${status.text}</span>
        </div>

        <div class="doc-meta">
          <span class="date">${formatTaskTime(task.created_at)}</span>
        </div>

        <div class="content doc-body" id="content-${task.id}">
          ${task.status === 'completed'
            ? '<div class="doc-wait"><span class="doc-wait-label">正在读取结果…</span></div>'
            : `<div class="doc-wait">
                 <span class="doc-wait-label">${status.text}</span>
                 <span class="doc-bar"><i style="width:${Math.round((task.progress || 0) * 100)}%"></i></span>
                 <span class="doc-wait-meta">${task.processed_pages || 0} / ${task.total_pages || 1} 页</span>
               </div>`}
        </div>

        <div class="footer doc-foot">
          <button class="copy-text-btn" onclick="copyPlainText('${task.id}')">复制文本</button>
          <button class="copy-markdown-btn" onclick="copyMarkdown('${task.id}')">复制 Markdown</button>
        </div>
      `;

      return card;
    }

    // 复制纯文本(从markdown提取)
    function copyPlainText(taskId) {
      const contentDiv = document.getElementById(`content-${taskId}`);
      const plainText = contentDiv.innerText || contentDiv.textContent;

      copyToClipboard(plainText, '文本已复制');
    }

    // 复制markdown源码
    async function copyMarkdown(taskId) {
      try {
        const backurl = "{{ backurl }}";
        const baseUrl = backurl || (window.location.origin + window.location.pathname.replace(/\/$/, ''));
        const response = await fetch(`${baseUrl}/api/tasks/${taskId}/result`, {
          credentials: 'include'
        });
        const data = await response.json();

        if (data.status === "success" && data.data) {
          const markdown = data.data.content || '';
          copyToClipboard(markdown, 'Markdown已复制');
        } else {
          alert('获取Markdown内容失败');
        }
      } catch (err) {
        console.error('复制失败:', err);
        alert('复制失败');
      }
    }

    // 统一复制方法
    function copyToClipboard(text, successMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          alert(successMsg);
        }).catch(err => {
          console.error('复制失败:', err);
          fallbackCopy(text, successMsg);
        });
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    // 降级复制方法(保持原有)
    function fallbackCopy(text, successMsg) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        const successful = document.execCommand('copy');
        if (successful) {
          alert(successMsg || "复制成功！");
        } else {
          alert("复制失败，请手动复制");
        }
      } catch (err) {
        console.error("复制失败:", err);
        alert("复制失败，请手动复制");
      }

      document.body.removeChild(textarea);
    }

    // 加载任务列表
    async function loadTasks() {
      const backurl = "{{ backurl }}";
      const baseUrl = backurl || (window.location.origin + window.location.pathname.replace(/\/$/, ''));
      const apiUrl = `${baseUrl}/api/tasks?limit=50`;

      console.log("正在加载任务列表:", apiUrl);

      try {
        const response = await fetch(apiUrl, {
          credentials: 'include'
        });
        const data = await response.json();

        console.log("任务列表响应:", data);

        if (data.status === "success" && data.data) {
          console.log("任务数量:", data.data.length);
          displayTasks(data.data);
        } else {
          console.error("任务列表加载失败:", data);
          // 清空所有任务卡片
          const existingCards = cardContainer.querySelectorAll('.card[data-task-id]');
          existingCards.forEach(card => card.remove());
        }
      } catch (err) {
        console.error("加载任务列表失败:", err);
        // 清空所有任务卡片
        const existingCards = cardContainer.querySelectorAll('.card[data-task-id]');
        existingCards.forEach(card => card.remove());
      }
    }

    // 显示任务列表为卡片形式
    function displayTasks(tasks) {
      console.log("显示任务列表，任务数:", tasks ? tasks.length : 0);

      if (!tasks || tasks.length === 0) {
        const existingCards = cardContainer.querySelectorAll('.card[data-task-id]');
        existingCards.forEach(card => card.remove());
        return;
      }

      // 按创建时间排序(新到旧)
      const sortedTasks = [...tasks].sort((a, b) => {
        const aTime = new Date(a.created_at || 0).getTime();
        const bTime = new Date(b.created_at || 0).getTime();
        return bTime - aTime;
      });

      // 构建任务ID映射
      const taskMap = new Map(sortedTasks.map(task => [task.id, task]));
      const existingCards = cardContainer.querySelectorAll('.card[data-task-id]');
      const existingTaskIds = new Set();

      // 更新现有卡片，删除不存在的卡片
      existingCards.forEach(card => {
        const taskId = card.dataset.taskId;
        if (taskMap.has(taskId)) {
          existingTaskIds.add(taskId);
          const task = taskMap.get(taskId);

          // 检查状态是否变化
          const statusBadge = card.querySelector('.status-badge');
          const currentStatus = card.dataset.taskStatus || '';

          if (currentStatus !== task.status) {
            // 更新卡片的状态标记
            card.dataset.taskStatus = task.status;

            // 更新状态徽章
            const statusConfig = {
              'pending': { class: 'status-pending', text: '等待中' },
              'processing': { class: 'status-processing', text: '处理中' },
              'completed': { class: 'status-completed', text: '已完成' },
              'failed': { class: 'status-failed', text: '失败' },
              'cancelled': { class: 'status-cancelled', text: '已取消' }
            };
            const status = statusConfig[task.status] || statusConfig['pending'];
            statusBadge.className = `status-badge ${status.class}`;
            statusBadge.textContent = status.text;

            // 如果变为已完成，加载内容
            if (task.status === 'completed') {
              loadTaskContentForCard(task.id);
            }
          }
        } else {
          // 任务不存在，删除卡片
          card.remove();
        }
      });

      // 添加新卡片并确保顺序正确
      sortedTasks.forEach((task, index) => {
        if (!existingTaskIds.has(task.id)) {
          const newCard = createResultCard(task);
          newCard.dataset.taskStatus = task.status;

          // 找到正确的插入位置
          if (index === 0) {
            // 插入到最前面
            const firstCard = cardContainer.querySelector('.card[data-task-id]');
            if (firstCard) {
              cardContainer.insertBefore(newCard, firstCard);
            } else {
              cardContainer.appendChild(newCard);
            }
          } else {
            // 找到前一个任务的卡片，插入到它后面
            const prevTask = sortedTasks[index - 1];
            const prevCard = cardContainer.querySelector(`[data-task-id="${prevTask.id}"]`);
            if (prevCard && prevCard.nextSibling) {
              cardContainer.insertBefore(newCard, prevCard.nextSibling);
            } else if (prevCard) {
              cardContainer.appendChild(newCard);
            } else {
              cardContainer.appendChild(newCard);
            }
          }

          // 如果是已完成任务，加载内容
          if (task.status === 'completed') {
            loadTaskContentForCard(task.id);
          }
        }
      });
    }

    // 加载任务内容到卡片
    async function loadTaskContentForCard(taskId) {
      const backurl = "{{ backurl }}";
      const baseUrl = backurl || (window.location.origin + window.location.pathname.replace(/\/$/, ''));

      try {
        const response = await fetch(`${baseUrl}/api/tasks/${taskId}/result`, {
          credentials: 'include'
        });
        const data = await response.json();

        if (data.status === "success" && data.data && data.data.status === 'completed') {
          const contentDiv = document.getElementById(`content-${taskId}`);
          if (contentDiv) {
            contentDiv.innerHTML = renderMarkdown(data.data.content);
          }
        }
      } catch (err) {
        console.error(`加载任务${taskId}内容失败:`, err);
      }
    }

    // 菜单控制
    const menuBtn = document.getElementById("menu-btn");
    const menuDropdown = document.getElementById("menu-dropdown");
    const aboutMenu = document.getElementById("about-menu");

    // 切换菜单显示/隐藏
    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      menuDropdown.classList.toggle("show");
    });

    // 点击页面其他地方关闭菜单
    document.addEventListener("click", () => {
      menuDropdown.classList.remove("show");
    });

    // 防止菜单内点击关闭菜单
    menuDropdown.addEventListener("click", (e) => {
      e.stopPropagation();
    });

    // 关于菜单点击事件
    aboutMenu.addEventListener("click", (e) => {
      e.preventDefault();
      alert("OCR 识别工具\n\n支持图片和PDF文件的文字识别\n基于AI技术实现高精度识别");
      menuDropdown.classList.remove("show");
    });

    // 加载用户信息和配额
    async function loadUserInfo() {
      const backurl = "{{ backurl }}";
      const baseUrl = backurl || (window.location.origin + window.location.pathname.replace(/\/$/, ''));

      try {
        const response = await fetch(`${baseUrl}/api/user/current`);
        const data = await response.json();

        if (data.status === "success" && data.data) {
          const user = data.data;
          const quota = user.quota;

          // 显示配额菜单项
          document.getElementById('remaining-pages').textContent = quota.remaining_pages.toLocaleString();
          const mirror = document.getElementById('remaining-pages-mirror');
          if (mirror) mirror.textContent = quota.remaining_pages.toLocaleString();
          document.getElementById('total-pages-quota').textContent = quota.total_pages.toLocaleString();
          document.getElementById('quota-menu-item').style.display = 'flex';

          // 显示兑换菜单项
          document.getElementById('redeem-menu-item').style.display = 'flex';

          // 显示登出菜单项
          document.getElementById('logout-menu-item').style.display = 'flex';

          // 如果是管理员,显示管理菜单项
          if (user.is_admin) {
            document.getElementById('admin-menu-item').style.display = 'flex';
          }
        }
      } catch (err) {
        console.error("加载用户信息失败:", err);
      }
    }

    // 兑换菜单项点击事件
    document.getElementById('redeem-menu-item').addEventListener('click', async () => {
      menuDropdown.classList.remove("show");

      const code = prompt("请输入兑换码:");
      if (!code || !code.trim()) {
        return;
      }

      const backurl = "{{ backurl }}";
      const baseUrl = backurl || (window.location.origin + window.location.pathname.replace(/\/$/, ''));

      try {
        const response = await fetch(`${baseUrl}/api/user/redeem`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ code: code.trim().toUpperCase() })
        });

        const data = await response.json();

        if (data.status === "success") {
          alert(data.message);
          // 刷新用户信息
          loadUserInfo();
        } else {
          alert(data.message || "兑换失败");
        }
      } catch (err) {
        console.error("兑换失败:", err);
        alert("兑换失败,请重试");
      }
    });

    // 管理菜单项点击事件
    document.getElementById('admin-menu-item').addEventListener('click', () => {
      menuDropdown.classList.remove("show");
      // 直接跳转到 /admin 路径
      window.location.href = '/admin';
    });

    // 登出菜单项点击事件
    document.getElementById('logout-menu-item').addEventListener('click', async () => {
      menuDropdown.classList.remove("show");

      if (!confirm('确定要登出吗？')) {
        return;
      }

      try {
        // 构建正确的登出 URL
        // 从当前路径提取基础路径（去除尾部斜杠）
        const currentPath = window.location.pathname.replace(/\/$/, '');
        const logoutUrl = `${currentPath}/api/auth/logout`;

        console.log('登出 URL:', logoutUrl);

        const response = await fetch(logoutUrl, {
          method: 'POST',
          credentials: 'include'
        });

        console.log('登出响应状态:', response.status);

        // 无论是否成功，都跳转到登录页面
        // 这样即使后端出错，前端也会跳转
        window.location.href = '/login';
      } catch (err) {
        console.error('登出失败:', err);
        // 即使出错也跳转到登录页面
        window.location.href = '/login';
      }
    });

    // WebSocket 连接管理
    let ws = null;
    let wsReconnectTimer = null;

    // 连接 WebSocket
    function connectWebSocket() {
      try {
        // 根据当前协议自动选择 ws 或 wss
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        // 从当前路径提取PASSWORD前缀(例如 /ocr/main 中的 ocr)
        const pathPrefix = window.location.pathname.split('/')[1];
        const wsPath = (pathPrefix && pathPrefix !== 'main') ? `/${pathPrefix}/ws` : '/ws';
        const wsUrl = `${protocol}//${window.location.host}${wsPath}`;

        console.log('正在连接 WebSocket:', wsUrl);
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          console.log('WebSocket 已连接');
          // 清除重连定时器
          if (wsReconnectTimer) {
            clearTimeout(wsReconnectTimer);
            wsReconnectTimer = null;
          }
        };

        ws.onmessage = (event) => {
          try {
            const message = JSON.parse(event.data);
            handleWebSocketMessage(message);
          } catch (err) {
            console.error('解析 WebSocket 消息失败:', err);
          }
        };

        ws.onerror = (error) => {
          console.error('WebSocket 错误:', error);
        };

        ws.onclose = () => {
          console.log('WebSocket 已断开，5秒后尝试重连...');
          ws = null;
          // 5秒后自动重连
          wsReconnectTimer = setTimeout(connectWebSocket, 5000);
        };
      } catch (err) {
        console.error('WebSocket 连接失败:', err);
        // 5秒后重试
        wsReconnectTimer = setTimeout(connectWebSocket, 5000);
      }
    }

    // 处理 WebSocket 消息
    function handleWebSocketMessage(message) {
      console.log('收到 WebSocket 消息:', message);

      // 处理任务取消消息
      if (message.type === 'task_cancelled') {
        console.log('任务已取消，刷新任务列表');
        loadTasks();
      }
      // 可以扩展处理其他消息类型
      else if (message.type === 'task_updated') {
        console.log('任务状态更新，刷新任务列表');
        loadTasks();
      }
      // 处理公告更新消息
      else if (message.type === 'announcement_updated') {
        console.log('收到公告更新通知，清除已同意记录并重新加载公告');
        localStorage.removeItem('announcement_agreed'); // 清除已同意状态
        loadAnnouncement();
      }
    }

    // 订阅任务更新（可选功能，供后续扩展使用）
    function subscribeTask(taskId) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'subscribe_task',
          task_id: taskId
        }));
      }
    }

    // 公告管理功能（弹窗模态框形式）
    let announcementConfig = null;

    // 生成公告内容的简单哈希值（用于判断是否已读）
    function simpleHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash; // Convert to 32bit integer
      }
      return hash.toString();
    }

    async function loadAnnouncement() {
      try {
        const backurl = "{{ backurl }}";
        const baseUrl = backurl || (window.location.origin + window.location.pathname.replace(/\/$/, ''));
        const response = await fetch(`${baseUrl}/api/announcement/config`);
        const data = await response.json();

        if (data.status === 'success' && data.enabled) {
          announcementConfig = data;
          showAnnouncement();
        }
      } catch (error) {
        console.error('加载公告失败:', error);
      }
    }

    function showAnnouncement() {
      if (!announcementConfig || !announcementConfig.enabled) return;

      // 只有在允许关闭的情况下才检查 localStorage
      if (announcementConfig.closable) {
        // 计算公告内容的哈希值
        const contentHash = simpleHash(announcementConfig.content);
        const agreedHash = localStorage.getItem('announcement_agreed');

        // 如果用户已经同意过此版本的公告，则不再显示
        if (agreedHash === contentHash) {
          console.log('用户已同意此版本公告，跳过显示');
          return;
        }
      }
      // 如果不允许关闭，则不检查 localStorage，每次都会显示弹窗

      const modal = document.getElementById('announcement-modal');
      const content = document.getElementById('announcement-modal-content');
      const header = document.getElementById('announcement-modal-header');
      const icon = document.getElementById('announcement-modal-icon');

      // 设置样式类型
      const typeStyles = {
        'info': { bg: '#eceeec', text: '#101614', icon: '#14696b', title: '系统公告' },
        'warning': { bg: '#f2efe6', text: '#3a3320', icon: '#7a6220', title: '重要提醒' },
        'success': { bg: '#e7efee', text: '#0f5355', icon: '#14696b', title: '通知' },
        'error': { bg: '#f7ebe7', text: '#7d2b17', icon: '#a33a22', title: '紧急公告' }
      };
      const style = typeStyles[announcementConfig.type] || typeStyles['info'];

      // 设置标题栏样式
      header.style.background = style.bg;
      header.style.color = style.text;
      icon.style.color = style.icon;
      header.querySelector('h2').textContent = style.title;

      // 渲染Markdown内容
      if (typeof marked !== 'undefined') {
        content.innerHTML = marked.parse(announcementConfig.content);
      } else {
        content.textContent = announcementConfig.content;
      }

      // 根据 closable 参数控制关闭按钮的显示
      const agreeBtn = document.getElementById('announcement-agree-btn');
      if (announcementConfig.closable) {
        agreeBtn.style.display = 'block';
        console.log('公告允许关闭，显示"我已知晓"按钮');
      } else {
        agreeBtn.style.display = 'none';
        console.log('公告不允许关闭，隐藏"我已知晓"按钮，用户无法关闭弹窗');
      }

      // 显示模态框
      modal.classList.remove('hidden');

      // 禁用页面滚动
      document.body.style.overflow = 'hidden';
    }

    function agreeAnnouncement() {
      if (!announcementConfig) return;

      // 只有在允许关闭时才能关闭弹窗
      if (!announcementConfig.closable) {
        console.log('公告不允许关闭，忽略关闭请求');
        return;
      }

      const modal = document.getElementById('announcement-modal');
      const contentHash = simpleHash(announcementConfig.content);

      // 记录用户已同意此版本公告
      localStorage.setItem('announcement_agreed', contentHash);
      console.log('用户已同意公告，哈希值已保存:', contentHash);

      // 隐藏模态框
      modal.classList.add('hidden');

      // 恢复页面滚动
      document.body.style.overflow = '';
    }

    // 页面加载时自动加载任务列表和用户信息
    window.addEventListener('load', () => {
      loadTasks();
      loadUserInfo();
      loadAnnouncement();  // 加载公告

      // 连接 WebSocket 实现实时更新
      connectWebSocket();

      // 每30秒自动刷新任务列表（作为 WebSocket 的备用机制）
      setInterval(loadTasks, 30000);
      // 每30秒自动刷新用户配额
      setInterval(loadUserInfo, 30000);
    });
  </script>
  <!-- 引入 marked.js 和 KaTeX -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex/dist/contrib/auto-render.min.js"></script>
